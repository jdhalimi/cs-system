[project]
name = "cs-system"
version = "0.1.0"
description = "Orchestration des donnees du conseil syndical"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.0",
    "google-auth-oauthlib>=1.0",
    "python-dotenv>=1.0",
    "playwright>=1.45",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "mkdocs>=1.6"]

[project.scripts]
cs-system = "cs_system.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cs_system"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["cs_system"]
branch = true
omit = ["*/connectors/*"]

[tool.coverage.report]
show_missing = true
fail_under = 70
